  <!-- Google AdSense — deferred to prioritize LCP/FID -->
  <script>
    (function() {
      let adLoaded = false;
      function loadAds() {
        if (adLoaded) return;
        adLoaded = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7472926437419938';
        s.crossOrigin = 'anonymous';
        document.head.appendChild(s);
        // Clean up listeners
        ['scroll', 'mousemove', 'touchstart', 'click'].forEach(function(e) {
          window.removeEventListener(e, loadAds);
        });
      }
      // Load on first user interaction
      ['scroll', 'mousemove', 'touchstart', 'click'].forEach(function(e) {
        window.addEventListener(e, loadAds, { once: true, passive: true });
      });
      // Fallback: load after 8 seconds if no interaction
      setTimeout(loadAds, 8000);
    })();
  </script>

    /* ─── Inline skeleton — eliminates white flash before React mounts ─── */

      position: fixed;
      top: 0; left: 0; right: 0;
      height: 64px;
      background: rgba(255,255,255,0.95);
      border-bottom: 1px solid #f1f5f9;

    }
    .sk-logo {

    }
    .sk-nav-spacer { flex: 1; }
    .sk-pill {
      width: 80px; height: 28px;
      background: #e2e8f0;
      border-radius: 20px;
    }
    .sk-btn {
      width: 90px; height: 36px;
      background: #6366f1;
      border-radius: 10px;
      opacity: 0.3;
    }
    .sk-hero {
      padding: 120px 24px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
    }
    .sk-hero-badge {
      width: 180px; height: 24px;
      background: #e0e7ff;
      border-radius: 20px;
    }
    .sk-hero-h1 {
      width: min(640px, 90vw); height: 52px;
      background: #e2e8f0;
      border-radius: 12px;
    }
    .sk-hero-sub {
      width: min(480px, 85vw); height: 20px;
      background: #f1f5f9;
      border-radius: 8px;
    }
    .sk-hero-cta {
      width: 180px; height: 48px;
      background: #6366f1;
      border-radius: 24px;
      opacity: 0.3;
      margin-top: 8px;
    }
    @keyframes sk-shimmer {
      0% { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .sk-logo, .sk-pill, .sk-hero-badge, .sk-hero-h1, .sk-hero-sub {
      background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
      background-size: 400px 100%;
      animation: sk-shimmer 1.4s ease-in-out infinite;
    }
    /* Hide skeleton once React mounts */
    #sk-shell { display: block; }
    #root:not(:empty) + * { display: none !important; }

<body>

  <div id="root"></div>

  <!-- Inline skeleton shell — visible instantly, hidden when React mounts -->
  <div id="sk-shell" aria-hidden="true">
    <div class="sk-nav">
      <div class="sk-logo"></div>
      <div class="sk-nav-spacer"></div>
      <div class="sk-pill" style="display:none" class="hidden sm:block"></div>
      <div class="sk-btn"></div>
    </div>
    <div class="sk-hero">
      <div class="sk-hero-badge"></div>
      <div class="sk-hero-h1"></div>
      <div class="sk-hero-sub"></div>
      <div class="sk-hero-sub" style="width: min(360px, 75vw)"></div>
      <div class="sk-hero-cta"></div>
    </div>
  </div>

  <script>
    // Hide skeleton immediately when React fills #root
    var root = document.getElementById('root');
    var shell = document.getElementById('sk-shell');
    if (root && shell) {
      var obs = new MutationObserver(function() {
        if (root.children.length > 0) {
          shell.style.display = 'none';
          obs.disconnect();
        }
      });
      obs.observe(root, { childList: true });
    }
  </script>

  <script type="module" src="/src/main.tsx"></script>

</body>
